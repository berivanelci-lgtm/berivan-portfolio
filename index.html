<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Berivan Elçi'nin kişisel portfolyosu">
  <title>Berivan's Little Digital Garden</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #fffaf7;
      --surface: #ffffff;
      --ink: #34313c;
      --muted: #77717e;
      --pink: #f4b8c8;
      --pink-dark: #d77d9b;
      --lav: #d9d1f3;
      --mint: #cce8d9;
      --yellow: #f8e6a5;
      --line: #eee3e2;
      --shadow: 0 18px 50px rgba(95,65,80,.10);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 85px;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: "DM Sans", sans-serif;
      line-height: 1.65;
      transition: background .3s, color .3s;
    }

    a {
      color: inherit;
    }

    button {
      font: inherit;
      cursor: pointer;
    }

    .wrap {
      width: min(1100px, calc(100% - 40px));
      margin: auto;
    }

    /* Welcome screen */
    .welcome {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 20% 20%, #fce7ed, transparent 35%),
        radial-gradient(circle at 80% 80%, #e5e0fa, transparent 36%),
        var(--bg);
      transition: opacity .55s, visibility .55s;
    }

    .welcome.hide {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .welcome-card {
      width: min(560px, 100%);
      text-align: center;
      background: rgba(255,255,255,.85);
      border: 1px solid white;
      border-radius: 30px;
      padding: 28px 24px 34px;
      box-shadow: var(--shadow);
    }

    .windowbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--line);
      padding-bottom: 14px;
      font: 12px "DM Mono", monospace;
      color: var(--muted);
    }

    .dots {
      color: var(--pink-dark);
      letter-spacing: 4px;
    }

    .tiny {
      font: 11px "DM Mono", monospace;
      letter-spacing: 2px;
      color: var(--muted);
      margin: 24px 0 6px;
    }

    .welcome h1 {
      font: 900 clamp(27px, 5vw, 42px)/1.2 Nunito, sans-serif;
      margin: 8px 0;
    }

    .welcome h1 em {
      color: var(--pink-dark);
      font-style: normal;
    }

    .welcome p {
      color: var(--muted);
      margin: 12px auto 18px;
      max-width: 390px;
    }

    .catbutton {
      border: 0;
      background: var(--pink);
      border-radius: 50%;
      width: 132px;
      height: 132px;
      display: grid;
      place-items: center;
      margin: 18px auto 10px;
      box-shadow: 0 9px 0 #e8a1b5;
      transition: transform .2s;
    }
